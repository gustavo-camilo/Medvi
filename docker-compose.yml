services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medvi-app
    restart: unless-stopped
    env_file:
      - .env.local
    expose:
      - "3000"
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    container_name: medvi-caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-medvi.com.br}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - web

networks:
  web:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
